{% extends "base.html" %}
{% load static %}

{% block content %}

<div id="main">
    <div class="inner">

        <h1>Our Products 🍰</h1>
        <p>Explore our freshly baked items.</p>

        <section class="tiles">

            {% for item in items %}
            <article class="style1">
                <span class="image">
                    <img src="{% static item.image %}" alt="" />
                </span>
                <div class="content">
                    <h2>{{ item.name }}</h2>
                    <p>₹{{ item.price }}</p>
                </div>
            </article>
            {% endfor %}

        </section>

    </div>
</div>

{% endblock %}
